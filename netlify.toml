[build]
  command = "npm ci && npm run build"
  publish = "dist"
  functions = "backend"

[build.environment]
  NODE_VERSION = "22"
  NPM_VERSION = "10"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/backend/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
